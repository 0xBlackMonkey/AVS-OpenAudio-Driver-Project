; avswin.cfg -- C:\Windows\System32\drivers\avs\avswin.cfg
; (max 8 KB; ';' starts a comment). Read at device start: after editing,
; disable + enable the "AVS" device in Device Manager, or reboot.
;
; Everything the driver loads lives in that one folder:
;   dsp_basefw.bin, avswin.cfg, the topology .bin files.
; (Old location C:\Windows\ is still accepted as a fallback.)
;
; ===== Board description: which codec topology sits on which SSP =====
; (what board_selection.c does in Linux; for C434 "shyvana":
;  MAX98927 speakers on SSP0, DA7219 headset on SSP1)
; Topology files: decompressed .bin (not .zst), same folder as this file.
Tplg0=max98927-tplg.bin
Tplg0SspMask=0x1
Tplg1=da7219-tplg.bin
Tplg1SspMask=0x2
; built-in digital microphones (PCH DMIC, no SSP)
Tplg2=dmic-tplg.bin
Tplg2SspMask=0x0

; ===== Windows endpoints (read once at device start) =====
; Endpoint<n>Fe   = topology FE path template feeding this endpoint
; Endpoint<n>Type = speaker | headphones | mic | headsetmic
;   (mic/headsetmic = recording endpoints; a name with spaces goes in quotes)
; Endpoint<n>CsAudioType = CSAudio endpointType sent on start/stop
;   (default: speaker 1, headphones 2 -- enum from CoolStar opengmaxcodec.h;
;    MAX98927 driver reacts to speaker, da7219.sys ignores CSAudio)
; n = 0..3. Without any Endpoint keys: one speaker endpoint on PlaybackFe.
Endpoint0Fe=ssp0p_fe
Endpoint0Type=speaker
Endpoint1Fe=ssp1p_fe
Endpoint1Type=headphones
Endpoint2Fe="DMIC FE"
Endpoint2Type=mic
Endpoint3Fe=ssp1c_fe
Endpoint3Type=headsetmic

; Headphone jack detection via da7219.sys's HID device (1 = on, 0 = off:
; headphones always shown). The HID interface is found by name: any of the
; '|'-separated IDs (ACPI ID DLGS7219 is what Windows puts in the name) plus
; the 2nd top-level collection; VID/PID 2DCF/7219 is then verified.
JackDetect=1
JackHidMatch=DLGS7219|VID_2DCF&PID_7219
JackHidCollection=COL02

; DSP gain (PEAKVOL), % of the topology's "DSP Volume" range, fixed.
; The Windows volume slider works in software on top of this.
; 100 = the topology's maximum (0x3FFFFFFF). Up to 200 is accepted
; (150 = +3.5 dB, 200 = +6 dB over 100). Unverified: if the firmware scale
; is Q1.31 like the DMIC range suggests, 100 is -6 dB and 200 is unity
; (no extra clipping). Either way small laptop speakers can be damaged at
; high levels -- raise in steps and listen for distortion.
DspVolumePercent=100

; DMIC gain (PEAKVOL "DMIC Volume"), % of 0..0x7FFFFFFF; 100 = presumably 1.0.
; The topology's range already ends at 0x7FFFFFFF, so values above 100 do
; nothing here. For a louder mic use the Windows "Levels" slider/boost.
MicVolumePercent=100

; HDA host DMA: BDL entries per cyclic buffer (buffer = whole pages)
HostStreamFrags=2

; ===== Diagnostics =====
; 440 Hz beep through the full stream path right after boot, in ms (0 = off),
; on endpoint BootBeepEndpoint, amplitude TestToneAmplitude (0..32767)
BootBeepMs=0
BootBeepEndpoint=0
TestToneAmplitude=300
; register dump of the host stream on every start
DebugStreams=0
; hex-dump every IPC payload (noisy: every play/stop sends IPC)
IpcDumpPayloads=0
; power up HDA multi-link per SSP before creating paths (kept from the old driver)
HdaLinkPowerUp=1

; ===== CSAudio (CoolStar codec drivers) =====
CSAudioEndpointTypeDSP=0
CSAudioEndpointTypeSpeaker=1
CSAudioEndpointRegister=0
CSAudioEndpointStart=1
CSAudioEndpointStop=2
